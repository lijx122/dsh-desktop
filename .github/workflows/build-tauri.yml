name: Build Tauri v2 Windows All-In-One

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js in Runner
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install DSH in CI Runner
        shell: pwsh
        run: |
          npm install -g @deepseek-ai/dsh@0.1.0-rc.6
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\runtime\bin"
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\runtime\node_modules\@deepseek-ai\dsh"
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath "src-tauri\resources\runtime\bin\node.exe" -Force
          $globalRoot = npm root -g
          Copy-Item -Recurse -Force "$globalRoot\@deepseek-ai\dsh\*" "src-tauri\resources\runtime\node_modules\@deepseek-ai\dsh\"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Binary
        working-directory: ./src-tauri
        run: |
          cargo build --release

      - name: Package Standalone Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-dist\DeepSeek-Harness-v1.4.0"
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-dist\DeepSeek-Harness-v1.4.0\DeepSeek-Harness.exe"
          Copy-Item -Recurse "src-tauri\resources" "release-dist\DeepSeek-Harness-v1.4.0\resources"
          Compress-Archive -Path "release-dist\DeepSeek-Harness-v1.4.0\*" -DestinationPath "release-dist\DeepSeek-Harness-Tauri-v2-AllInOne-v1.4.0.zip" -Force
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-dist\DeepSeek-Harness-Tauri-v2-Launcher-v1.4.0.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "DeepSeek Harness Desktop (Tauri v2 Native Viewport Scheme C) v1.4.0"
          body: |
            ## DeepSeek Harness (DSH) 原生视口停靠版 (Tauri v2 方案 C) v1.4.0

            - 🌟 **方案 C 原生视口停靠（Native Docked Viewport）**：采用 Tauri v2 Child Webview 原生技术，右侧侧边栏内嵌渲染，彻底消除 X-Frame / frame-ancestors 限制。
            - 🚀 **双击即开（Zero-Dependency）**：内置完整 Node.js 24 + 全量 DSH 核心依赖与守护进程。
            - 🔄 **系统托盘与生命周期管理**：支持后台服务重启、界面重载、窗口托盘最小化。
            - 🖥️ **无缝 DOM 坐标同步**：侧边栏与原生视口实时自动锚定。
          files: |
            release-dist/DeepSeek-Harness-Tauri-v2-AllInOne-v1.4.0.zip
            release-dist/DeepSeek-Harness-Tauri-v2-Launcher-v1.4.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
