name: Build Tauri v2 Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri Binary
        working-directory: ./src-tauri
        run: |
          cargo build --release

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-artifacts"
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-artifacts\DeepSeek-Harness-Tauri-v2-AllInOne-v1.2.0.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Tauri-v2-AllInOne-v1.2.0
          path: release-artifacts/DeepSeek-Harness-Tauri-v2-AllInOne-v1.2.0.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "DeepSeek Harness Desktop (Tauri v2 All-in-One) v1.2.0"
          body: |
            ## DeepSeek Harness (DSH) 原生桌面客户端 (Tauri v2 All-in-One) v1.2.0

            - 🚀 **内置 Node.js & DSH Daemon 守护**：无需预装 Node/npm，自动拉起服务。
            - 🔄 **托盘一键重启**：系统托盘右键增加「🔄 重启 DSH 后台服务」功能。
            - 🛡️ **侧边栏拦截源头穿透**：底层拦截探测接口，抹平 blocked 拦截卡片。
            - 🖱️ **拖拽图片/文件支持**：打通 WebView2 拖放事件。
          files: |
            release-artifacts/DeepSeek-Harness-Tauri-v2-AllInOne-v1.2.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
