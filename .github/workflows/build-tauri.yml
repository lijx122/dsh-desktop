name: Build Tauri v2 Windows Pure Client

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Binary
        working-directory: ./src-tauri
        run: |
          cargo build --release

      - name: Package Portable Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-dist\DeepSeek-Harness-PureClient-v1.5.0"
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-dist\DeepSeek-Harness-PureClient-v1.5.0\DeepSeek-Harness.exe"
          Compress-Archive -Path "release-dist\DeepSeek-Harness-PureClient-v1.5.0\*" -DestinationPath "release-dist\DeepSeek-Harness-Tauri-v2-PureClient-v1.5.0.zip" -Force
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-dist\DeepSeek-Harness-v1.5.0.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "DeepSeek Harness Pure Client (Tauri v2) v1.5.0"
          body: |
            ## DeepSeek Harness 纯净桌面轻量客户端 (Tauri v2) v1.5.0

            - 🚀 **极速、超低内存占用**：仅 ~30MB 内存占用，无庞大的 Chrome 浏览器多进程开销。
            - 📦 **纯绿色单文件运行包**：完全免安装，解压后双击 `DeepSeek-Harness.exe` 即可直接运行。
            - 🛡️ **解耦设计**：不捆绑、不强行托管 Node/DSH 后台，配合外部正常运行的 `dsh web`（端口 3080）使用。
            - 🔄 **系统托盘集成**：支持最小化至托盘、单击唤出/隐藏、托盘右键刷新 (Ctrl+R) 与退出。
          files: |
            release-dist/DeepSeek-Harness-Tauri-v2-PureClient-v1.5.0.zip
            release-dist/DeepSeek-Harness-v1.5.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
