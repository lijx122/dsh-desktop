name: Build Tauri v2 Windows Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js in Runner
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install DSH & Tauri CLI in CI Runner
        shell: pwsh
        run: |
          npm install -g @deepseek-ai/dsh@0.1.0-rc.6 @tauri-apps/cli@2
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\runtime\bin"
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\runtime\node_modules\@deepseek-ai\dsh"
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath "src-tauri\resources\runtime\bin\node.exe" -Force
          $globalRoot = npm root -g
          Copy-Item -Recurse -Force "$globalRoot\@deepseek-ai\dsh\*" "src-tauri\resources\runtime\node_modules\@deepseek-ai\dsh\"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Binary & NSIS Installer
        run: |
          npx tauri build

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-dist"
          
          # 1. Locate and copy the NSIS Setup Installer (.exe)
          $nsisExe = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" -Recurse | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "release-dist\DeepSeek-Harness-v1.4.0-Setup.exe" -Force
          }
          
          # 2. Package Standalone Portable Zip
          New-Item -ItemType Directory -Force -Path "release-dist\DeepSeek-Harness-Portable"
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-dist\DeepSeek-Harness-Portable\DeepSeek-Harness.exe" -Force
          Copy-Item -Recurse "src-tauri\resources" "release-dist\DeepSeek-Harness-Portable\resources" -Force
          Compress-Archive -Path "release-dist\DeepSeek-Harness-Portable\*" -DestinationPath "release-dist\DeepSeek-Harness-v1.4.0-Portable.zip" -Force
          
          # 3. Copy launcher executable directly
          Copy-Item "src-tauri\target\release\dsh-desktop-tauri.exe" "release-dist\DeepSeek-Harness.exe" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "DeepSeek Harness v1.4.0 (Windows Setup Installer)"
          body: |
            ## DeepSeek Harness (DSH) 官方桌面安装包 v1.4.0

            - 💿 **Windows 一键安装包（.exe Setup）**：直接下载 `DeepSeek-Harness-v1.4.0-Setup.exe`，支持自动创建桌面与开始菜单快捷方式。
            - 🐋 **官方 DeepSeek 专属视觉与图标**：全套 DeepSeek 官方图标与极简暗黑启动动画。
            - 🚀 **全内置零依赖**：内置完整 Node.js 24 + 全量 DSH 核心服务，开箱即用。
            - 🔄 **系统托盘后台守护**：后台静默运行、托盘一键控制与安全退出。
          files: |
            release-dist/DeepSeek-Harness-v1.4.0-Setup.exe
            release-dist/DeepSeek-Harness-v1.4.0-Portable.zip
            release-dist/DeepSeek-Harness.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
